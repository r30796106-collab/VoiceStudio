name: VoiceStudio tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Compile package
        run: python -m compileall -q src tests

  read-only-review:
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Blue Ant read-only reviewers
        uses: actions/checkout@v4
        with:
          repository: r30796106-collab/Blue-ant
          ref: main
          path: blue-ant
          persist-credentials: false
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixed read-only specialist review
        env:
          PYTHONPATH: blue-ant/src
        run: |
          mkdir -p artifacts
          python -m blue_ant.subbot_report --repo target --output artifacts/read-only-review.json
          cat artifacts/read-only-review.json
      - name: Upload read-only review report
        uses: actions/upload-artifact@v4
        with:
          name: read-only-review-report
          path: artifacts/read-only-review.json
          if-no-files-found: error
          retention-days: 7
